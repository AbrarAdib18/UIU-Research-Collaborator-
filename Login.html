<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN || UIU ResearchCollab</title>

        <!-- Bootstrap-5 CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- INDEX CSS -->
    <link rel="stylesheet" href="CSS/login.css">
</head>
<body>
    <!-- ANIMATED BACKGROUND -->
    <div class="auth-background">
        <div class="auth-grid"></div>
        <div class="auth-orb auth-orb-1"></div>
        <div class="auth-orb auth-orb-2"></div>
        <div class="auth-orb auth-orb-3"></div>
        <div class="auth-particle particle-1"></div>
        <div class="auth-particle particle-2"></div>
        <div class="auth-particle particle-3"></div>
        <div class="auth-particle particle-4"></div>
        <div class="auth-particle particle-5"></div>
        <div class="auth-particle particle-6"></div>
    </div>

<!-- LOGIN CONTAINER -->
<main class="auth-container">

    <!-- LOGIN CARD -->
    <section class="auth-card login-card">

        <!-- LOGO -->
        <div class="auth-logo">
            <div class="auth-logo-circle">
                <img src="../UIU Research Collaboration Portal/IMAGES/logo.jpg" alt="UIU ResearchCollab Logo">
            </div>
        </div>

        <!-- HEADING -->
        <div class="auth-heading">
            <h1>Welcome Back</h1>
            <p>
                Sign in to continue to
                <strong>UIU ResearchCollab</strong>
            </p>
        </div>

        <!-- LOGIN FORM -->
        <form class="auth-form" id="loginForm" action="#" method="POST">

            <!-- EMAIL ADDRESS -->
            <div class="auth-input-group">
                <label for="login-email">
                    Email Address
                </label>
                <div class="auth-input-wrapper">

                    <!-- Email Icon -->
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <polyline points="3 7 12 13 21 7"/>
                    </svg>

                    <!-- Email Input -->
                    <input
                        type="email"
                        id="login-email"
                        name="email"
                        placeholder="Enter your UIU email"
                        pattern="[A-Za-z0-9._%+-]+@bscse\.uiu\.ac\.bd"
                        title="Please enter your BSCSE UIU email address, e.g. name@bscse.uiu.ac.bd"
                        autocomplete="email"
                        required
                    >
                </div>
            </div>

            <!-- PASSWORD -->
            <div class="auth-input-group">

                <!-- Password Label + Forgot Password -->
                <div class="auth-label-row">
                    <label for="login-password">
                        Password
                    </label>
                    <a href="#" class="forgot-password">
                        Forgot Password?
                    </a>
                </div>

                <!-- Password Input Wrapper -->
                <div class="auth-input-wrapper">

                    <!-- Password Icon -->
                    <svg
                        width="18"
                        height="18"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        aria-hidden="true"
                    >
                        <rect
                            x="3"
                            y="11"
                            width="18"
                            height="10"
                            rx="2"
                        />
                        <path
                            d="M7 11V7a5 5 0 0110 0v4"
                        />
                    </svg>

                    <!-- Password Input -->
                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Enter your password"
                        minlength="8"
                        pattern="(?=.*[^A-Za-z0-9]).{8,}"
                        title="Password must be at least 8 characters long and contain at least 1 special character."
                        autocomplete="current-password"
                        required
                    >

                    <!-- Password Show/Hide Button -->
                    <button
                        type="button"
                        class="password-toggle"
                        id="passwordToggle"
                        aria-label="Show password"
                    >
                        <!-- Eye Icon -->
                        <svg
                            class="eye-icon"
                            width="18"
                            height="18"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            aria-hidden="true"
                        >
                            <path
                                d="M2 12s3.5-7 10-7
                                10 7 10 7-3.5 7-10 7
                                S2 12 2 12z"
                            />
                            <circle
                                cx="12"
                                cy="12"
                                r="3"
                            />
                        </svg>
                    </button>
                </div>
            </div>

            <!-- REMEMBER ME -->
            <div class="auth-options">
                <label class="remember-me">
                    <input
                        type="checkbox"
                        name="remember"
                        id="rememberMe"
                    >
                    <span>
                        Remember me
                    </span>
                </label>
            </div>

            <!-- LOGIN BUTTON -->
            <button
                type="submit"
                class="auth-submit-btn"
                id="loginSubmit"
            >
                <span>
                    Login
                </span>

                <!-- Arrow -->
                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    aria-hidden="true"
                >
                    <path
                        d="M5 12h14"
                    />
                    <path
                        d="M13 6l6 6-6 6"
                    />
                </svg>

                <!-- Button Glow -->
                <span class="button-glow"></span>
            </button>
        </form>

        <!-- DIVIDER -->
        <div class="auth-divider">
            <span>
                OR
            </span>
        </div>

        <!-- SIGNUP SECTION -->
        <div class="auth-bottom">
            <p>
                Don't have an account?
                <a href="Signup.html">
                    Create Account
                </a>
            </p>
        </div>

        <!-- FOOTER -->
        <div class="auth-footer">
            <span>
                UIU ResearchCollab
            </span>
            <span>
                •
            </span>
            <span>
                Connecting Minds. Creating Research.
            </span>
        </div>
    </section>
</main>

<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<!-- LOGIN JS -->
<script>
document.addEventListener("DOMContentLoaded", function () {

    // PASSWORD SHOW / HIDE
    const passwordToggle =
        document.getElementById("passwordToggle");

    const passwordInput =
        document.getElementById("login-password");


    if (passwordToggle && passwordInput) {

        passwordToggle.addEventListener("click", function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                passwordToggle.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                passwordInput.type = "password";

                passwordToggle.setAttribute(
                    "aria-label",
                    "Show password"
                );

            }

        });

    }

    // LOGIN FORM VALIDATION
    const loginForm =
        document.getElementById("loginForm");

    const emailInput =
        document.getElementById("login-email");

    const password =
        document.getElementById("login-password");


    if (loginForm) {

        loginForm.addEventListener("submit", function (event) {

            event.preventDefault();

            // EMAIL VALIDATION
            const emailPattern =
                /^[A-Za-z0-9._%+-]+@bscse\.uiu\.ac\.bd$/;


            if (!emailPattern.test(emailInput.value.trim())) {

                emailInput.setCustomValidity(
                    "Please enter a valid BSCSE UIU email address."
                );

                emailInput.reportValidity();

                return;

            } else {

                emailInput.setCustomValidity("");

            }

            // PASSWORD VALIDATION
            const passwordPattern =
                /^(?=.*[^A-Za-z0-9]).{8,}$/;


            if (!passwordPattern.test(password.value)) {

                password.setCustomValidity(
                    "Password must be at least 8 characters long and contain at least 1 special character."
                );

                password.reportValidity();

                return;

            } else {

                password.setCustomValidity("");

            }

            /* =============================================
               FRONTEND TEST

               LATER LARAVEL WILL HANDLE LOGIN
            ============================================== */
            console.log("Login validation successful.");

            console.log(
                "Email:",
                emailInput.value.trim()
            );

        });

        // CLEAR ERROR
        emailInput.addEventListener("input", function () {

            emailInput.setCustomValidity("");

        });

        password.addEventListener("input", function () {

            password.setCustomValidity("");
        });
    }
});
</script>

</body>
</html>
